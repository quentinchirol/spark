# En local (kind), les images sont chargées sur le nœud : imagePullPolicy Never.
# Sur GKE, elles viennent du registre. Always : une étiquette mobile (develop) est
# toujours relue ; seules les couches modifiées sont téléchargées.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spark-connect
  namespace: spark
spec:
  template:
    spec:
      containers:
        - name: spark-connect
          imagePullPolicy: Always
          env:
            - name: SPARK_EXECUTOR_PULL_POLICY
              value: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecrivain
  namespace: spark
spec:
  template:
    spec:
      containers:
        - name: ecrivain
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passerelle
  namespace: spark
spec:
  template:
    spec:
      containers:
        - name: passerelle
          imagePullPolicy: Always
---
# Dagster : ses pods tirent lakehouse-dagster, et les pilotes Spark qu'il crée tirent spark-lakehouse
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dagster
  namespace: spark
imagePullSecrets:
  - name: ghcr-pull
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-code
  namespace: spark
spec:
  template:
    spec:
      initContainers:
        - name: attendre-base
          imagePullPolicy: Always
      containers:
        - name: dagster-code
          imagePullPolicy: Always
          env:
            - name: POLITIQUE_TIRAGE_IMAGES
              value: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-webserver
  namespace: spark
spec:
  template:
    spec:
      containers:
        - name: dagster-webserver
          imagePullPolicy: Always
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dagster-daemon
  namespace: spark
spec:
  template:
    spec:
      containers:
        - name: dagster-daemon
          imagePullPolicy: Always
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-dashboard
  namespace: spark
spec:
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: pipeline
              imagePullPolicy: Always
