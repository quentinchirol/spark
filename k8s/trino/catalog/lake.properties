# Même catalogue Iceberg (Apache Polaris) et même stockage (MinIO) que Spark : les tables lake.<schéma>.<table> sont partagées
connector.name=iceberg
iceberg.catalog.type=rest
# Trino s'authentifie dans Polaris avec le principal « trino » (rôle de catalogue lecture seule)
iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
iceberg.rest-catalog.warehouse=lake
iceberg.rest-catalog.security=OAUTH2
iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CREDENTIAL}
iceberg.rest-catalog.oauth2.scope=PRINCIPAL_ROLE:ALL
iceberg.rest-catalog.oauth2.server-uri=http://polaris:8181/api/catalog/v1/oauth/tokens
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=us-east-1
# clé S3 en LECTURE SEULE (utilisateur MinIO « trino ») : Trino lit les tables, seul Spark les écrit
s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_S3_SECRET_KEY}

# Lecture seule AU NIVEAU DU CONNECTEUR, en plus de rules.json : le contrôle d'accès par fichier
# ne sait pas interdire les procédures de maintenance (ALTER TABLE ... EXECUTE optimize,
# expire_snapshots...) ; le connecteur en lecture seule les refuse, comme toute écriture.
iceberg.security=read_only
