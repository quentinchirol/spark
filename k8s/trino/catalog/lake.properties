# Même catalogue Iceberg et même stockage que Spark : les tables lake.<schéma>.<table> sont partagées
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://iceberg-rest:8181
iceberg.rest-catalog.warehouse=s3://warehouse/
fs.native-s3.enabled=true
s3.endpoint=http://seaweedfs:8333
s3.path-style-access=true
s3.region=us-east-1
# clé S3 en LECTURE SEULE : Trino lit les tables, seul Spark les écrit
s3.aws-access-key=${ENV:TRINO_S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:TRINO_S3_SECRET_KEY}

# Lecture seule AU NIVEAU DU CONNECTEUR, en plus de rules.json : le contrôle d'accès par fichier
# ne sait pas interdire les procédures de maintenance (ALTER TABLE ... EXECUTE optimize,
# expire_snapshots...) ; le connecteur en lecture seule les refuse, comme toute écriture.
iceberg.security=read_only
