# Trino sur un seul nœud : le coordinateur exécute aussi les requêtes
coordinator=true
node-scheduler.include-coordinator=true
catalog.management=static

# HTTP (port 8080) : usage interne au pod uniquement (sondes) ; les clients passent en HTTPS (8443)
http-server.http.port=8080
discovery.uri=http://localhost:8080
http-server.https.enabled=true
http-server.https.port=8443
http-server.https.keystore.path=/etc/trino/tls/trino-tls.pem
internal-communication.shared-secret=${ENV:TRINO_SHARED_SECRET}

# chaque personne se connecte avec son nom et son token (même fichier que Spark Connect)
http-server.authentication.type=PASSWORD
web-ui.authentication.type=form

# mémoire : pod de 2 Gi. Tas Java 1g + 256m hors tas max (jvm.config), le reste pour la JVM elle-même.
# Mémoire par requête 640MB + marge (30 % du tas) < tas. Trino voit les 12 cœurs du nœud mais n'a
# que 2 Gi : 4 lectures en parallèle au plus, sinon les tampons de lecture S3 dépassent la limite (OOM)
task.max-worker-threads=4
task.concurrency=4
query.max-memory=640MB
query.max-memory-per-node=640MB

# garde-fous : Trino sert des lectures rapides ; un traitement plus long relève de Spark
# (le préparer en table agrégée, cf. python/pipeline.py)
query.max-execution-time=2m
