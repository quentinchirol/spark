# Le transformateur « images: » de kustomize remplace aussi les valeurs de variables
# d'environnement qui désignent une image (ex. SPARK_EXECUTOR_IMAGE=spark-lakehouse:4.1.3).
# Seules les valeurs dont le nom correspond à une entrée de « images: » sont modifiées.
# Déclaré dans k8s/kustomization.yaml, hérité par les overlays (k8s/overlays/*).
images:
  - path: spec/template/spec/containers/env/value
    kind: Deployment
  - path: spec/jobTemplate/spec/template/spec/containers/env/value
    kind: CronJob
