# Opérateur Strimzi 0.50.1 (Kafka 4.0 à 4.1.1) : fichier officiel de la version, sans modification
#   https://github.com/strimzi/strimzi-kafka-operator/releases/download/0.50.1/strimzi-cluster-operator-0.50.1.yaml
# Installé dans le namespace spark : il y gère les ressources Kafka, KafkaNodePool, KafkaTopic.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spark
resources:
  - strimzi-cluster-operator-0.50.1.yaml
# le fichier officiel désigne le compte de l'opérateur dans le namespace « myproject » : kustomize ne réécrit pas
# les « subjects » des liaisons de droits, d'où ces patches (procédure Strimzi : remplacer ce namespace)
patches:
  - target:
      kind: RoleBinding
      name: strimzi-cluster-operator.*
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: spark
  - target:
      kind: ClusterRoleBinding
      name: strimzi-cluster-operator.*
    patch: |-
      - op: replace
        path: /subjects/0/namespace
        value: spark
