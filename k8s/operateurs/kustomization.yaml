# Opérateurs Kubernetes : à appliquer AVANT k8s/ (leurs CRD doivent exister avant les ressources qui les utilisent).
#   kubectl apply -k k8s/operateurs
#   kubectl wait --for=condition=established crd/postgresqls.acid.zalan.do
#   kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spark
resources:
  # namespace aussi déclaré ici : les opérateurs s'installent avant k8s/ (même objet que k8s/commun/namespace.yaml)
  - namespace.yaml
  # PostgreSQL principal (Patroni) : docs/decisions/001-postgres-principal-zalando.md
  - postgres-operator/postgresql.crd.yaml
  - postgres-operator/operatorconfiguration.crd.yaml
  - postgres-operator/postgresteam.crd.yaml
  - postgres-operator/configmap.yaml
  - postgres-operator/operator-service-account-rbac.yaml
  - postgres-operator/postgres-operator.yaml
  - postgres-operator/api-service.yaml
patches:
  - target:
      kind: ConfigMap
      name: postgres-operator
    patch: |-
      # les 3 instances PostgreSQL de préférence dans 3 zones différentes (préférence : un cluster kind
      # à 1 nœud reste utilisable)
      - op: replace
        path: /data/enable_pod_antiaffinity
        value: "true"
      - op: replace
        path: /data/pod_antiaffinity_preferred_during_scheduling
        value: "true"
      - op: replace
        path: /data/pod_antiaffinity_topology_key
        value: topology.kubernetes.io/zone
      # droits d'écriture du volume de données pour l'utilisateur postgres de Spilo
      - op: add
        path: /data/spilo_fsgroup
        value: "103"
