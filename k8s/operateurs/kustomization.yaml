# Opérateurs Kubernetes : à appliquer AVANT k8s/ (leurs CRD doivent exister avant les ressources qui les utilisent).
#   kubectl apply --server-side -k k8s/operateurs
#   kubectl wait --for=condition=established crd/postgresqls.acid.zalan.do crd/kafkas.kafka.strimzi.io crd/scaledobjects.keda.sh
#   kubectl apply -k k8s
# Chaque opérateur fixe son propre namespace dans son sous-dossier (KEDA vit dans « keda » et touche kube-system :
# pas de namespace imposé ici).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  # namespace aussi déclaré ici : les opérateurs s'installent avant k8s/ (même objet que k8s/commun/namespace.yaml)
  - namespace.yaml
  # PostgreSQL principal (Patroni) : docs/decisions/001-postgres-principal-zalando.md
  - postgres-operator
  # Kafka (topics app et events)
  - strimzi
  # autoscaling des writers selon le retard Kafka
  - keda
