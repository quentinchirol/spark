# Stockage objet S3 : MinIO distribué (fork communautaire pgsty/minio : le dépôt officiel
# minio/minio est archivé depuis février 2026). 4 pods, 1 volume chacun, codage d'effacement :
# les données sont découpées en 2 blocs + 2 blocs de parité répartis sur les 4 pods.
#   - 1 pod arrêté  : lecture ET écriture continuent (quorum d'écriture = 3 pods sur 4) ;
#   - 2 pods arrêtés : lecture seule, aucune donnée perdue.
# Les pods se répartissent sur les zones (topologySpreadConstraints) et, à défaut, sur les nœuds.
# Deux identités S3 (créées par le Job minio-init) :
#   - spark (Secret s3-credentials)  : lecture + écriture (Spark, Polaris) ;
#   - trino (Secret s3-trino)        : LECTURE SEULE.
apiVersion: v1
kind: Service
metadata:
  name: minio-nodes
spec:
  # DNS stable des pods (minio-0.minio-nodes…) pour que MinIO s'assemble ; publié avant que les pods soient prêts
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  # point d'entrée des clients : http://minio:9000 (n'importe quel pod sert la requête)
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
spec:
  serviceName: minio-nodes
  replicas: 4
  podManagementPolicy: Parallel      # les 4 pods démarrent ensemble (MinIO attend ses pairs)
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: minio
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: minio
      containers:
        - name: minio
          image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
          command: ["minio"]
          args:
            - server
            - http://minio-{0...3}.minio-nodes.spark.svc.cluster.local/data
            - --address=:9000
            - --console-address=:9001
          envFrom:
            - secretRef:
                name: minio-root       # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: s3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: s3
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: minio
spec:
  # une maintenance de nœud n'arrête jamais plus d'un pod MinIO à la fois (quorum d'écriture conservé)
  maxUnavailable: 1
  selector:
    matchLabels:
      app: minio
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
spec:
  # crée les buckets « warehouse » et « sources » et les utilisateurs spark (lecture+écriture) et trino (lecture seule) ;
  # peut être relancé sans effet de bord
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: pgsty/mc:latest
          command: ["sh", "-c"]
          args:
            - |
              until mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD" >/dev/null 2>&1; do
                echo "MinIO pas encore prêt"; sleep 3
              done
              # MinIO répond avant que le cluster soit formé (« Server not initialized yet », constaté en CI :
              # bucket warehouse jamais créé). Chaque étape est donc réessayée jusqu'à réussir, sinon le Job échoue
              # et Kubernetes le relance (backoffLimit). Les arguments ne sont jamais affichés (clés S3).
              reessayer() {
                etape=$1; shift
                essai=0
                until "$@"; do
                  essai=$((essai + 1))
                  if [ "$essai" -ge 20 ]; then echo "ECHEC : $etape"; return 1; fi
                  echo "$etape : nouvel essai ($essai)"; sleep 3
                done
              }
              reessayer "bucket warehouse" mc mb --ignore-existing local/warehouse || exit 1
              # fichiers déposés pour les traitements à la demande (s3://sources/ventes/…, k8s/traitements)
              reessayer "bucket sources" mc mb --ignore-existing local/sources || exit 1
              # Un utilisateur tout juste créé peut être encore inconnu du nœud qui reçoit
              # l'association de politique (« The specified user does not exist », constaté en CI : spark sans
              # droits, 403 ensuite). On réessaie jusqu'à voir la politique sur l'utilisateur ; sinon le Job échoue
              # et Kubernetes le relance (backoffLimit). « attach » échoue aussi si la politique est déjà attachée :
              # seule la vérification compte. L'image mc n'a pas grep : comparaison par motif du shell.
              attacher() {
                essai=0
                while [ "$essai" -lt 20 ]; do
                  essai=$((essai + 1))
                  mc admin policy attach local "$1" --user "$2" >/dev/null 2>&1 || true
                  # « readwrite » ou « readonly » n'apparaît dans la fiche de l'utilisateur que comme politique
                  case "$(mc admin user info local "$2" --json 2>/dev/null)" in
                    *"\"$1"*) echo "politique $1 attachée"; return 0 ;;
                  esac
                  echo "politique $1 pas encore attachée (essai $essai), nouvel essai"; sleep 3
                done
                echo "ECHEC : politique $1 non attachée"; return 1
              }
              reessayer "utilisateur spark" mc admin user add local "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" || exit 1
              attacher readwrite "$AWS_ACCESS_KEY_ID" || exit 1
              reessayer "utilisateur trino" mc admin user add local "$TRINO_S3_ACCESS_KEY" "$TRINO_S3_SECRET_KEY" || exit 1
              attacher readonly "$TRINO_S3_ACCESS_KEY" || exit 1
              echo "bucket et utilisateurs prêts"
          envFrom:
            - secretRef:
                name: minio-root
            - secretRef:
                name: s3-credentials
            - secretRef:
                name: s3-trino
