# Stockage objet compatible S3 : fichiers Parquet et métadonnées des tables Iceberg.
# Deux identités S3 :
# - spark (Secret s3-credentials, k8s/secrets/s3.env) : lecture + écriture (Spark, catalogue Iceberg) ;
# - trino (Secret s3-trino, k8s/secrets/s3-trino.env) : LECTURE SEULE. Même si les règles de Trino
#   étaient mal configurées, il ne pourrait pas écrire un seul fichier.
# Bucket "warehouse" créé au démarrage.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.48
          command: ["sh", "-c"]
          args:
            - |
              cat > /tmp/s3.json <<EOF
              {"identities":[
                {"name":"spark",
                 "credentials":[{"accessKey":"$AWS_ACCESS_KEY_ID","secretKey":"$AWS_SECRET_ACCESS_KEY"}],
                 "actions":["Admin","Read","Write","List","Tagging"]},
                {"name":"trino",
                 "credentials":[{"accessKey":"$TRINO_S3_ACCESS_KEY","secretKey":"$TRINO_S3_SECRET_KEY"}],
                 "actions":["Read","List"]}]}
              EOF
              exec weed server -dir=/data -ip=localhost -ip.bind=0.0.0.0 -volume.max=0 \
                -s3 -s3.port=8333 -s3.config=/tmp/s3.json
          lifecycle:
            postStart:
              exec:
                # crée le bucket des tables Iceberg (sans effet s'il existe déjà)
                command:
                  - sh
                  - -c
                  - |
                    for i in $(seq 1 60); do
                      echo "s3.bucket.list" | weed shell -master=localhost:9333 2>/dev/null | grep -q warehouse && exit 0
                      echo "s3.bucket.create -name warehouse" | weed shell -master=localhost:9333 >/dev/null 2>&1
                      sleep 2
                    done
          envFrom:
            - secretRef:
                name: s3-credentials
            - secretRef:
                name: s3-trino
          ports:
            - name: s3
              containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: s3
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
      targetPort: s3
