# Catalogue Iceberg REST : liste des tables et de leurs versions (SQLite sur volume persistant).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iceberg-catalog
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: iceberg-rest
  template:
    metadata:
      labels:
        app: iceberg-rest
    spec:
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: iceberg-rest
          image: apache/iceberg-rest-fixture:1.10.1
          env:
            # catalogue persistant (SQLite sur volume) au lieu de /tmp
            - name: CATALOG_URI
              value: jdbc:sqlite:/var/lib/iceberg/catalog.db
            - name: CATALOG_WAREHOUSE
              value: s3://warehouse/
            - name: CATALOG_IO__IMPL
              value: org.apache.iceberg.aws.s3.S3FileIO
            - name: CATALOG_S3_ENDPOINT
              value: http://seaweedfs:8333
            - name: CATALOG_S3_PATH__STYLE__ACCESS
              value: "true"
            - name: AWS_REGION
              value: us-east-1
          envFrom:
            - secretRef:
                name: s3-credentials
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /v1/config
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          volumeMounts:
            - name: catalog
              mountPath: /var/lib/iceberg
      volumes:
        - name: catalog
          persistentVolumeClaim:
            claimName: iceberg-catalog
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
spec:
  selector:
    app: iceberg-rest
  ports:
    - name: http
      port: 8181
      targetPort: http
