# Instance Dagster (configMapGenerator dagster-instance : $DAGSTER_HOME/dagster.yaml)
storage:
  postgres:
    postgres_db:
      hostname: lake-outils
      port: 5432
      db_name: dagster
      # pilote psycopg2 (installé avec dagster-postgres) : SQLAlchemy 2.1 prend psycopg 3 par défaut, absent de l'image
      scheme: postgresql+psycopg2
      username:
        env: DAGSTER_PG_USERNAME
      password:
        env: DAGSTER_PG_PASSWORD
# file d'attente des runs (démon) : au plus 4 runs ensemble, et UN SEUL run par traitement à la fois
# (deux runs « ventes » simultanés se disputeraient les mêmes tables)
run_coordinator:
  module: dagster.core.run_coordinator
  class: QueuedRunCoordinator
  config:
    max_concurrent_runs: 4
    tag_concurrency_limits:
      - key: traitement
        value:
          applyLimitPerUniqueValue: true
        limit: 1
# un run = un processus dans le serveur de code ; chaque étape Spark y attend son Job Kubernetes
run_launcher:
  module: dagster.core.launcher
  class: DefaultRunLauncher
# runs bloqués au démarrage ou à l'annulation : passés en échec par le démon
run_monitoring:
  enabled: true
  start_timeout_seconds: 300
  cancel_timeout_seconds: 300
# historique conservé 90 jours (runs et ticks des planifications)
retention:
  schedule:
    purge_after_days: 90
# sorties brutes des étapes non conservées (elles resteraient sur le disque du pod dagster-code, illisibles par
# l'interface) : les 300 dernières lignes du journal de chaque pilote Spark sont recopiées dans le journal
# d'événements du run (PostgreSQL), lisible depuis l'interface (python/orchestration)
compute_logs:
  module: dagster.core.storage.noop_compute_log_manager
  class: NoOpComputeLogManager
telemetry:
  enabled: false
