# --- Kubernetes ---
spark.master                                     k8s://https://kubernetes.default.svc
spark.submit.deployMode                          client
spark.kubernetes.namespace                       spark
# image des executors (avec les jars Iceberg) : ajoutée au démarrage du pod depuis
# SPARK_EXECUTOR_IMAGE / SPARK_EXECUTOR_PULL_POLICY (cf. deployment.yaml), toujours la même que le serveur
spark.kubernetes.authenticate.caCertFile         /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
spark.kubernetes.authenticate.oauthTokenFile     /var/run/secrets/kubernetes.io/serviceaccount/token
# spark.kubernetes.driver.pod.name et spark.driver.host sont ajoutés au démarrage
# du pod (cf. deployment.yaml) : les executors joignent le driver par son IP
# et sont supprimés automatiquement si le pod driver disparaît
spark.kubernetes.executor.deleteOnTermination    true

# --- Réseau driver <-> executors ---
spark.driver.port                                7078
spark.blockManager.port                          7079

# --- Ressources par executor ---
# 2 cœurs par executor : moins de pods, plus d'échanges de données en mémoire au sein d'un même pod.
# Pod = memory + memoryOverhead (mémoire hors tas Java : lecture Parquet/S3, réseau). Cette part
# double avec 2 tâches en parallèle : avec la marge par défaut (384m), les pods dépassaient leur
# limite et étaient tués (OOM). 3 x 1792Mi + driver + stockage + Trino (2Gi) tiennent dans Docker Desktop (~11,5 Go).
# Avec plus de mémoire dans Docker Desktop : augmenter maxExecutors (et passer à 2g).
spark.executor.cores                             2
spark.executor.memory                            1g
spark.executor.memoryOverhead                    768m
spark.kubernetes.executor.request.cores          1

# --- Création des executors à la demande ---
spark.dynamicAllocation.enabled                  true
spark.dynamicAllocation.shuffleTracking.enabled  true
# 2 executors toujours prêts : la première requête après une pause n'attend pas le démarrage de pods
spark.dynamicAllocation.minExecutors             2
spark.dynamicAllocation.initialExecutors         2
spark.dynamicAllocation.maxExecutors             3
# délai de tâches en attente avant de demander des executors
spark.dynamicAllocation.schedulerBacklogTimeout  1s
# un executor inactif depuis ce délai est supprimé
spark.dynamicAllocation.executorIdleTimeout      30s
# un executor qui héberge des fichiers de shuffle n'est jamais considéré inactif : sans
# ce délai, il resterait allumé indéfiniment après la première agrégation (groupBy, count...)
spark.dynamicAllocation.shuffleTracking.timeout  60s
# supprime les fichiers de shuffle (disque) à la fin de chaque requête Spark Connect
spark.sql.connect.shuffleDependency.fileCleanup.enabled  true
# un executor qui garde des données en cache (df.cache()) est libéré après ce délai
spark.dynamicAllocation.cachedExecutorIdleTimeout  15min
spark.kubernetes.allocation.batch.size           5

# --- Serveur Spark Connect ---
spark.connect.grpc.binding.port                  15002
spark.driver.memory                              2g
# authentification par token personnel (image/)
spark.connect.grpc.interceptor.classes           fr.spark.auth.TokenAuthInterceptor
# journal d'audit : qui a exécuté quoi (lignes "AUDIT" dans les logs du pod)
spark.extraListeners                             fr.spark.auth.AuditListener
# partage équitable des executors entre requêtes simultanées
spark.scheduler.mode                             FAIR
spark.scheduler.allocation.file                  /opt/spark/conf-k8s/fairscheduler.xml
# garde-fou : un résultat trop gros renvoyé au client ne fait pas tomber le serveur
spark.driver.maxResultSize                       512m
# 32 tâches par regroupement / jointure au lieu de 200 : moins de coût fixe sur les petits volumes ;
# l'exécution adaptative (AQE, active par défaut) regroupe ou découpe ensuite selon la taille réelle
spark.sql.shuffle.partitions                     32

# --- Iceberg : catalogue "lake" (tables lake.<namespace>.<table>) ---
spark.sql.extensions                             org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lake                           org.apache.iceberg.spark.SparkCatalog
# catalogue Apache Polaris (API REST Iceberg, OAuth2) ; « lake » = nom du catalogue dans Polaris.
# Le credential du principal « spark » (rôle écriture) est ajouté au démarrage du pod depuis
# POLARIS_CREDENTIAL (cf. deployment.yaml) : jamais dans ce fichier.
spark.sql.catalog.lake.type                      rest
spark.sql.catalog.lake.uri                       http://polaris:8181/api/catalog
spark.sql.catalog.lake.warehouse                 lake
spark.sql.catalog.lake.oauth2-server-uri         http://polaris:8181/api/catalog/v1/oauth/tokens
spark.sql.catalog.lake.scope                     PRINCIPAL_ROLE:ALL
# fichiers dans MinIO (clé S3 « spark » lue dans les variables AWS_*)
spark.sql.catalog.lake.io-impl                   org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lake.s3.endpoint               http://minio:9000
spark.sql.catalog.lake.s3.path-style-access      true
spark.sql.catalog.lake.client.region             us-east-1
# cache des métadonnées (préparation de chaque requête) :
# - description des tables gardée 5 min après le dernier usage au lieu de 30 s
#   (une écriture faite par ce serveur met le cache à jour ; une écriture par un autre outil
#   n'est vue qu'à l'expiration du délai) ;
# - manifests (listes des fichiers et statistiques) gardés en mémoire : ils ne sont jamais modifiés
spark.sql.catalog.lake.cache-enabled                          true
spark.sql.catalog.lake.cache.expiration-interval-ms           300000
spark.sql.catalog.lake.io.manifest.cache-enabled              true
spark.sql.catalog.lake.io.manifest.cache.expiration-interval-ms  300000
# identifiants S3 : variables AWS_* lues dans le Secret s3-credentials (driver et executors)
spark.kubernetes.executor.secretKeyRef.AWS_ACCESS_KEY_ID      s3-credentials:AWS_ACCESS_KEY_ID
spark.kubernetes.executor.secretKeyRef.AWS_SECRET_ACCESS_KEY  s3-credentials:AWS_SECRET_ACCESS_KEY

# --- Jointures sans redistribution (storage-partitioned join) ---
# deux tables Iceberg découpées de la même façon (bucket(16, id_client)) sont jointes
# morceau par morceau, sans échange de données entre executors.
# NE PAS activer spark.sql.sources.v2.bucketing.allowJoinKeysSubsetOfPartitionKeys.enabled :
# avec une table partitionnée par (mois, client), elle fausse les fonctions de fenêtre
# (constaté sur Spark 4.1.3 : rangs tous à 1). Les tables sont donc découpées par client seulement.
spark.sql.sources.v2.bucketing.enabled                                   true
spark.sql.sources.v2.bucketing.pushPartValues.enabled                    true
spark.sql.sources.v2.bucketing.partiallyClusteredDistribution.enabled    true
spark.sql.iceberg.planning.preserve-data-grouping                        true
