# Déploiement complet : kubectl apply -k k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: spark
resources:
  - commun/namespace.yaml
  - commun/rbac.yaml
  - stockage/minio.yaml
  - stockage/polaris.yaml
  - spark-connect/deployment.yaml
  - trino/deployment.yaml
  - pipeline/cronjob.yaml
  # PostgreSQL principal (nécessite k8s/operateurs appliqué avant)
  - postgres/principal.yaml
  - postgres/schema.yaml
  # Kafka (nécessite k8s/operateurs) : file d'attente des écritures de l'application
  - kafka/kafka.yaml
  - kafka/topics.yaml
  # writers Kafka → PostgreSQL, autoscalés par KEDA
  - ecrivain/deployment.yaml
  - ecrivain/scaledobject.yaml
  # passerelle d'écriture de référence (HTTP → Kafka)
  - passerelle/deployment.yaml
  # Dagster (nécessite k8s/operateurs) : orchestration des traitements Spark à la demande (k8s/traitements)
  - dagster/postgres.yaml
  - dagster/deployment.yaml
# images désignées dans des variables d'environnement (image des executors Spark)
configurations:
  - config-kustomize/images-env.yaml
configMapGenerator:
  # scripts SQL de la base lake (Job lake-schema), joués dans l'ordre des noms
  - name: lake-sql
    files:
      - postgres/sql/01-extensions.sql
      - postgres/sql/02-modele.sql
      - postgres/sql/03-roles.sql
      - postgres/sql/04-planification.sql
  # script d'initialisation de Polaris (Job polaris-init)
  - name: polaris-init
    files:
      - init.py=stockage/polaris-init.py
  # schéma de la base de Polaris (créé au premier démarrage de polaris-db)
  - name: polaris-db-init
    files:
      - init.sql=stockage/polaris-db-init.sql
  # configuration de l'instance Dagster (base, file d'attente des runs) et emplacement du code
  - name: dagster-instance
    files:
      - dagster/dagster.yaml
      - dagster/workspace.yaml
  # traitements Spark à la demande, montés dans les pods pilotes créés par Dagster
  - name: traitements
    files:
      - traitements/spark-defaults.conf
      - traitements/lancer.sh
      - traitements/ventes.py
      - traitements/evenements.py
    options:
      # nom fixe : référencé par les Jobs créés par Dagster (python/orchestration), hors de kustomize
      disableNameSuffixHash: true
  - name: spark-conf
    files:
      - spark-connect/spark-defaults.conf
      - spark-connect/fairscheduler.xml
  - name: trino-conf
    files:
      - trino/config.properties
      - trino/password-authenticator.properties
      - trino/access-control.properties
      - trino/resource-groups.properties
      - trino/jvm.config
  - name: trino-rules
    files:
      - trino/rules.json
      - trino/resource-groups.json
  - name: trino-catalog
    files:
      - trino/catalog/lake.properties
secretGenerator:
  # une ligne "utilisateur=token" par personne (fichier non versionné), utilisée par Spark Connect et Trino
  - name: spark-connect-tokens
    files:
      - tokens=secrets/tokens
    options:
      # nom fixe : une mise à jour des tokens est rechargée à chaud, sans redémarrer le serveur
      disableNameSuffixHash: true
  # identifiants du stockage S3 (fichier non versionné)
  - name: s3-credentials
    envs:
      - secrets/s3.env
    options:
      # nom fixe : référencé par les pods executors créés par Spark
      disableNameSuffixHash: true
  # clé S3 en lecture seule pour Trino (fichier non versionné)
  - name: s3-trino
    envs:
      - secrets/s3-trino.env
    options:
      disableNameSuffixHash: true
  # token du traitement planifié (même valeur que la ligne pipeline=… de secrets/tokens)
  - name: pipeline-token
    envs:
      - secrets/pipeline.env
  # secret partagé interne à Trino (fichier non versionné)
  - name: trino-secrets
    envs:
      - secrets/trino.env
  # certificat HTTPS de Trino : clé + certificat (fichiers non versionnés ; trino-cert.pem pour les clients)
  - name: trino-tls
    files:
      - secrets/trino-tls.pem
  # administrateur MinIO (création du bucket et des utilisateurs spark / trino)
  - name: minio-root
    envs:
      - secrets/minio-root.env
  # Polaris : compte root + mot de passe de la base du catalogue
  - name: polaris-secrets
    envs:
      - secrets/polaris.env
  # identifiants OAuth2 de Spark (écriture) et de Trino (lecture seule) dans Polaris
  - name: polaris-spark
    envs:
      - secrets/polaris-spark.env
    options:
      disableNameSuffixHash: true
  - name: polaris-trino
    envs:
      - secrets/polaris-trino.env
  # sauvegardes PostgreSQL (WAL-G) vers le stockage objet hors cluster
  - name: sauvegardes-postgres
    envs:
      - secrets/sauvegardes.env
    options:
      disableNameSuffixHash: true
  # PostgreSQL principal (pg_lake) : écrit les tables app.* via Polaris
  - name: polaris-postgres
    envs:
      - secrets/polaris-postgres.env
  # clés de signature des jetons Polaris (identiques sur les 2 pods)
  - name: polaris-keys
    files:
      - secrets/polaris-private.pem
      - secrets/polaris-public.pem
