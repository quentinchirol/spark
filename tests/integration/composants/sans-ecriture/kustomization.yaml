# Retire les writers (et leur autoscaling KEDA) et la passerelle d'un overlay de test qui garde Kafka sans eux.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ecrivain
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: keda.sh/v1alpha1
      kind: ScaledObject
      metadata:
        name: ecrivain
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: passerelle
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: passerelle
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: passerelle
        namespace: spark
