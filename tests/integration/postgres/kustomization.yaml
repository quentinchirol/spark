# PostgreSQL principal + stockage pour la CI : k8s/ sans Spark Connect, Trino ni le traitement planifié,
# ressources réduites pour tenir sur un runner GitHub (2 cœurs, 7 Go). Nécessite k8s/operateurs.
#   kubectl apply -k tests/integration/postgres
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../k8s
components:
  - ../composants/sans-kafka
  - ../composants/sans-dagster
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: spark-connect
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trino
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: pipeline-dashboard
        namespace: spark
  - target:
      kind: postgresql
      name: lake-principal
    patch: |-
      - op: replace
        path: /spec/resources/requests
        value: {cpu: 50m, memory: 256Mi}
      - op: replace
        path: /spec/sidecars/0/resources/requests
        value: {cpu: 25m, memory: 128Mi}
      # PGDUCK_MEMORY_LIMIT garde sa valeur de base (1GB) : à 256MB, DuckDB manque de mémoire pendant la fusion
      # vers Iceberg et pgduck_server s'arrête (constaté en CI)
      - op: replace
        path: /spec/volume/size
        value: 2Gi
      # autovacuum de pg_lake chaque minute (10 min en production) : le test vérifie qu'il compacte app.commandes
      - op: replace
        path: /spec/postgresql/parameters/pg_lake_iceberg.autovacuum_naptime
        value: "60"
  # pool analytique : 1 pod, demandes réduites (les limites ne changent pas)
  - target:
      kind: Deployment
      name: lake-analytique
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: {cpu: 50m, memory: 256Mi}
      - op: replace
        path: /spec/template/spec/containers/1/resources/requests
        value: {cpu: 25m, memory: 256Mi}
      # synchronisation toutes les 20 s (60 en production) : le test attend l'apparition d'une nouvelle table
      - op: add
        path: /spec/template/spec/containers/2/env/-
        value: {name: INTERVALLE_S, value: "20"}
      # CPU du pool plafonné à 1/2 cœur par conteneur sur le runner à 2 cœurs : le reste du cluster garde sa part,
      # et une charge analytique dépasse vite la cible de l'autoscaling
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 500m
      - op: replace
        path: /spec/template/spec/containers/1/resources/limits/cpu
        value: 500m
      # attente maximale d'une place ramenée de 120 à 20 s pour tester le refus sans attendre 2 minutes
      - op: replace
        path: /spec/template/spec/containers/3/env/1/value
        value: "20"
  - target:
      kind: HorizontalPodAutoscaler
      name: lake-analytique
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  - target:
      kind: Deployment
      name: polaris
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 50m
