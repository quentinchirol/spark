# Orchestration pour la CI : Dagster (+ sa base lake-outils) lance les traitements Spark « ventes » et « maintenance »
# sur MinIO + Polaris.
# Sans Spark Connect, Trino, traitement planifié, PostgreSQL principal ni Kafka ; réduit pour un runner GitHub
# (2 cœurs, 7 Go) : 1 instance PostgreSQL, CPU réservé minimal, Jobs supprimés 20 s après leur fin.
# Nécessite k8s/operateurs.
#   kubectl apply -k tests/integration/orchestration
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../k8s
components:
  - ../composants/sans-analytique
  - ../composants/sans-kafka
  - ../composants/stockage-reduit
  - ../composants/dagster-reduit
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: spark-connect
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trino
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: pipeline-dashboard
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: acid.zalan.do/v1
      kind: postgresql
      metadata:
        name: lake-principal
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: lake-schema
        namespace: spark
  # pas de Kafka dans ce test : capteur du topic « events » arrêté (tests/integration/evenements le vérifie)
  - target:
      kind: Deployment
      name: dagster-code
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CAPTEURS, value: arretes}
      # orphelins supprimés quel que soit leur âge (en production : après 72 h) : celui posé par le test a 1 min
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: ORPHELINS_APRES_H, value: "0"}
