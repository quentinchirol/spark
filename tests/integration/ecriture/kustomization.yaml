# Chemin d'écriture pour la CI : passerelle → Kafka → writers (KEDA) → PostgreSQL, avec MinIO + Polaris.
# Sans Spark Connect, Trino ni traitement planifié ; réduit pour un runner GitHub (2 cœurs, 7 Go) :
# 1 nœud Kafka (réplication 1), 1 instance PostgreSQL, writers 1 → 4 avec des lots de 50 messages et un seuil
# de retard bas, pour voir KEDA ajouter puis retirer des writers pendant le test. Nécessite k8s/operateurs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../k8s
components:
  - ../composants/sans-analytique
  - ../composants/sans-dagster
  - ../composants/kafka-reduit
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: spark-connect
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: trino
        namespace: spark
  - patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: pipeline-dashboard
        namespace: spark
  - target:
      kind: postgresql
      name: lake-principal
    patch: |-
      - op: replace
        path: /spec/numberOfInstances
        value: 1
      - op: replace
        path: /spec/resources/requests
        value: {cpu: 50m, memory: 256Mi}
      - op: replace
        path: /spec/sidecars/0/resources/requests
        value: {cpu: 25m, memory: 128Mi}
      - op: replace
        path: /spec/volume/size
        value: 2Gi
  - target:
      kind: Deployment
      name: ecrivain
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "50"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: {cpu: 10m, memory: 128Mi}
  - target:
      kind: ScaledObject
      name: ecrivain
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 1
      - op: replace
        path: /spec/maxReplicaCount
        value: 4
      - op: replace
        path: /spec/triggers/0/metadata/lagThreshold
        value: "100"
      - op: replace
        path: /spec/advanced/horizontalPodAutoscalerConfig/behavior/scaleDown/stabilizationWindowSeconds
        value: 20
  - target:
      kind: Deployment
      name: passerelle
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests
        value: {cpu: 25m, memory: 128Mi}
  - target:
      kind: HorizontalPodAutoscaler
      name: passerelle
    patch: |-
      - op: replace
        path: /spec/minReplicas
        value: 1
      - op: replace
        path: /spec/maxReplicas
        value: 2
  - target:
      kind: StatefulSet
      name: minio
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  - target:
      kind: Deployment
      name: polaris
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
  - target:
      kind: StatefulSet
      name: polaris-db
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 25m
