# Intégration continue : à chaque push et à chaque pull request vers develop ou main.
#   - python      : lint (ruff), compilation, tests unitaires (sans cluster)
#   - sql         : modèle chaud + froid du PostgreSQL principal (tests/sql, PostgreSQL éphémère)
#   - manifestes  : kustomize build + validation des schémas Kubernetes (kubeconform)
#   - images      : construction des images Docker (publication : workflow « Images »)
# Les tests d'intégration (cluster kind) tournent dans le workflow « Integration ».
name: CI

on:
  # les branches feature/** sont vérifiées par leur pull request (pas de double exécution)
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint et tests unitaires
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements*.txt
      - name: Dépendances
        run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Compilation
        run: python -m compileall -q .
      - name: Tests unitaires (sans cluster)
        run: |
          if [ -d tests/unitaires ]; then
            pytest tests/unitaires -q
          else
            echo "Pas encore de tests unitaires"
          fi

  sql:
    name: SQL · modèle chaud + froid
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: ci
    steps:
      - uses: actions/checkout@v4
      - name: Tests du modèle (tables ordinaires à la place d'Iceberg)
        run: psql -X -v ON_ERROR_STOP=1 -f tests/sql/modele.sql

  secrets:
    name: Aucun secret versionné
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.24.3
    steps:
      - uses: actions/checkout@v4
      - name: Rien dans k8s/secrets à part le README
        run: |
          fichiers=$(git ls-files k8s/secrets | grep -vx 'k8s/secrets/README.md' || true)
          if [ -n "$fichiers" ]; then
            echo "::error::Fichiers secrets versionnés (utiliser scripts/generer-secrets.sh) :"
            echo "$fichiers"
            exit 1
          fi
      - name: Aucune clé ni aucun token dans les fichiers (gitleaks)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks dir . --redact --no-banner --exit-code 1

  manifestes:
    name: Manifestes Kubernetes
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.6.7
    steps:
      - uses: actions/checkout@v4
      - name: Secrets factices (les vrais ne sont jamais versionnés)
        run: |
          if [ -x scripts/generer-secrets.sh ]; then
            scripts/generer-secrets.sh --si-absents
          fi
      - name: Installer kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Construire et valider chaque kustomization
        run: |
          set -euo pipefail
          # k8s/ = manifestes de base ; infra/*/manifestes = overlays par environnement (GKE…)
          for k in $(find k8s infra tests -name kustomization.yaml -not -path '*/composants/*' | sort); do
            dossier=$(dirname "$k")
            echo "::group::$dossier"
            kubectl kustomize "$dossier" > /tmp/rendu.yaml
            kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              /tmp/rendu.yaml
            echo "::endgroup::"
          done

  images:
    name: Image ${{ matrix.nom }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: spark-lakehouse
            contexte: image
          - nom: lakehouse-pipeline
            contexte: python
          - nom: postgres-lake
            contexte: image/postgres-lake
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          push: false
          tags: ${{ matrix.nom }}:ci
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
