# Publication des images dans le registre GitHub (ghcr.io) à chaque push sur develop ou main.
#   ghcr.io/<propriétaire>/spark-lakehouse:<branche>   et  :sha-<commit>
#   ghcr.io/<propriétaire>/lakehouse-pipeline:<branche> et  :sha-<commit>
# Le cluster GKE tire ces images (k8s/overlays/gke) ; en local, kind charge les images construites sur place.
name: Images

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publier:
    name: Publier ${{ matrix.nom }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - nom: spark-lakehouse
            contexte: image
          - nom: lakehouse-pipeline
            contexte: python
          - nom: postgres-lake
            contexte: image/postgres-lake
          - nom: lakehouse-ecrivain
            contexte: python
            fichier: python/ecrivain/Dockerfile
          - nom: lakehouse-passerelle
            contexte: python
            fichier: python/passerelle/Dockerfile
          - nom: lakehouse-dagster
            contexte: python
            fichier: python/orchestration/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.nom }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexte }}
          file: ${{ matrix.fichier || format('{0}/Dockerfile', matrix.contexte) }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.nom }}
          cache-to: type=gha,mode=max,scope=${{ matrix.nom }}
