# Tests d'intégration sur un vrai cluster Kubernetes (kind), un job par sujet :
#   - stockage : MinIO (4 pods) + Polaris (2 pods) : table lisible, 1 pod MinIO arrêté, droits du principal trino ;
#   - postgres : PostgreSQL principal (Zalando + pg_lake) : réplication synchrone, vue chaud + froid,
#                fusion planifiée vers Iceberg, lecture des mêmes lignes par un autre moteur via Polaris ;
#                sauvegardes WAL-G hors cluster et restauration à un instant donné dans un cluster neuf.
# Voir tests/integration/. Se lance sur les changements du stockage et à la demande.
name: Integration

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "k8s/**"
      - "tests/integration/**"
      - "image/postgres-lake/**"
      - "scripts/**"
      - "scripts/generer-secrets.sh"
      - ".github/workflows/integration.yml"
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stockage:
    name: Stockage · MinIO + Polaris sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lakehouse
      - name: Secrets de test
        run: scripts/generer-secrets.sh --si-absents
      - name: Déployer le stockage
        run: kubectl apply -k tests/integration/stockage
      - name: Attendre MinIO, les Jobs d'initialisation et Polaris
        run: |
          kubectl -n spark rollout status sts/minio --timeout=240s
          kubectl -n spark wait --for=condition=complete job/minio-init job/polaris-bootstrap job/polaris-init --timeout=300s
          kubectl -n spark rollout status deploy/polaris --timeout=240s
          kubectl -n spark get pods -o wide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test d'intégration
        run: |
          # Polaris renvoie aux clients l'adresse S3 http://minio:9000 : on la fait pointer vers le port-forward
          echo '127.0.0.1 minio' | sudo tee -a /etc/hosts
          pip install "pyiceberg[pyarrow]"
          python tests/integration/tester_stockage.py
      - name: Diagnostic en cas d'échec
        if: failure() || cancelled()
        run: |
          kubectl -n spark get pods,jobs -o wide || true
          for r in sts/minio deploy/polaris job/minio-init job/polaris-bootstrap job/polaris-init sts/polaris-db; do
            echo "::group::logs $r"; kubectl -n spark logs "$r" --all-containers --tail=80 --prefix || true; echo "::endgroup::"
          done
          kubectl -n spark describe pods | tail -150 || true

  postgres:
    name: PostgreSQL principal · Zalando + pg_lake + sauvegardes sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image PostgreSQL + pg_lake
        uses: docker/build-push-action@v6
        with:
          context: image/postgres-lake
          load: true
          tags: postgres-lake:18
          cache-from: type=gha,scope=postgres-lake
          cache-to: type=gha,mode=max,scope=postgres-lake
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lakehouse
      - name: Charger l'image dans kind
        run: kind load docker-image postgres-lake:18 --name lakehouse
      - name: Secrets de test
        run: scripts/generer-secrets.sh --si-absents
      - name: Stockage des sauvegardes, hors de Kubernetes (conteneur Docker sur le réseau de kind)
        run: scripts/dev/sauvegardes.sh
      - name: Opérateur PostgreSQL
        run: |
          kubectl apply --server-side -k k8s/operateurs
          kubectl wait --for=condition=established crd/postgresqls.acid.zalan.do crd/kafkas.kafka.strimzi.io crd/kafkanodepools.kafka.strimzi.io crd/kafkatopics.kafka.strimzi.io crd/scaledobjects.keda.sh --timeout=120s
          kubectl -n spark rollout status deploy/postgres-operator --timeout=240s
      - name: Déployer stockage + PostgreSQL
        run: kubectl apply -k tests/integration/postgres
      - name: Attendre MinIO, Polaris, PostgreSQL et le schéma
        run: |
          kubectl -n spark rollout status sts/minio --timeout=240s
          kubectl -n spark wait --for=condition=complete job/minio-init job/polaris-bootstrap job/polaris-init --timeout=300s
          kubectl -n spark wait --for=jsonpath='{.status.PostgresClusterStatus}'=Running postgresql/lake-principal --timeout=600s
          kubectl -n spark wait --for=condition=complete job/lake-schema --timeout=300s
          kubectl -n spark get pods -o wide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test d'intégration
        run: |
          echo '127.0.0.1 minio' | sudo tee -a /etc/hosts
          pip install "pyiceberg[pyarrow]"
          python tests/integration/tester_postgres.py
      - name: Sauvegardes et restauration à un instant donné
        run: python tests/integration/tester_restauration.py
      - name: Diagnostic en cas d'échec
        if: failure() || cancelled()
        run: |
          kubectl -n spark get pods,jobs,postgresql -o wide || true
          for r in deploy/postgres-operator job/lake-schema job/polaris-init deploy/polaris; do
            echo "::group::logs $r"; kubectl -n spark logs "$r" --all-containers --tail=80 --prefix || true; echo "::endgroup::"
          done
          for p in $(kubectl -n spark get pods -l 'cluster-name in (lake-principal,lake-restaure)' -o name); do
            echo "::group::logs $p"; kubectl -n spark logs "$p" --all-containers --tail=120 --prefix || true; echo "::endgroup::"
          done
          kubectl -n spark describe pods -l cluster-name=lake-principal | tail -80 || true
