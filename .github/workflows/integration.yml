# Tests d'intégration sur un vrai cluster Kubernetes (kind), un job par sujet :
#   - stockage : MinIO (4 pods) + Polaris (2 pods) : table lisible, 1 pod MinIO arrêté, droits du principal trino ;
#   - postgres : PostgreSQL principal (Zalando + pg_lake) : réplication synchrone, vue chaud + froid,
#                pool analytique en lecture seule (tables du catalogue, données de l'application en < 2 min),
#                fusion planifiée vers Iceberg, lecture des mêmes lignes par un autre moteur via Polaris ;
#                sauvegardes WAL-G hors cluster et restauration à un instant donné dans un cluster neuf ;
#   - ecriture : passerelle → Kafka → writers (KEDA) → PostgreSQL : ni perte ni doublon malgré un writer tué,
#                writers ajoutés puis retirés selon le retard, test de charge k6 réduit (p99 < 500 ms) ;
#   - orchestration : Dagster lance le traitement Spark « ventes » (fichiers → bronze → silver → gold) en Jobs
#                Kubernetes éphémères : contenu exact, reprise sans doublon, échec provoqué → 3 essais et aucune
#                donnée partielle, plus aucun pod à la fin ;
#   - evenements : topic Kafka events → lake.bronze.events lancé par le capteur Dagster (retard au-delà du seuil),
#                pilote Spark supprimé en plein run : chaque message exactement une fois ; événement isolé dans bronze
#                en moins de 15 min.
# Voir tests/integration/. Se lance sur les changements du stockage et à la demande.
name: Integration

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "k8s/**"
      - "tests/integration/**"
      - "image/**"
      - "scripts/**"
      - "python/ecrivain/**"
      - "python/passerelle/**"
      - "python/orchestration/**"
      - "python/lakehouse/contrat.py"
      - "scripts/generer-secrets.sh"
      - ".github/workflows/integration.yml"
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stockage:
    name: Stockage · MinIO + Polaris sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lakehouse
          config: scripts/dev/kind.yaml
      - name: Secrets de test
        run: scripts/generer-secrets.sh --si-absents
      - name: Déployer le stockage
        run: kubectl apply -k tests/integration/stockage
      - name: Attendre MinIO, les Jobs d'initialisation et Polaris
        run: |
          kubectl -n spark rollout status sts/minio --timeout=240s
          kubectl -n spark wait --for=condition=complete job/minio-init job/polaris-bootstrap job/polaris-init --timeout=300s
          kubectl -n spark rollout status deploy/polaris --timeout=240s
          kubectl -n spark get pods -o wide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test d'intégration
        run: |
          # Polaris renvoie aux clients l'adresse S3 http://minio:9000 : on la fait pointer vers le port-forward
          echo '127.0.0.1 minio' | sudo tee -a /etc/hosts
          pip install "pyiceberg[pyarrow]"
          python tests/integration/tester_stockage.py
      - name: Diagnostic en cas d'échec
        if: failure() || cancelled()
        run: |
          kubectl -n spark get pods,jobs -o wide || true
          for r in sts/minio deploy/polaris job/minio-init job/polaris-bootstrap job/polaris-init sts/polaris-db; do
            echo "::group::logs $r"; kubectl -n spark logs "$r" --all-containers --tail=80 --prefix || true; echo "::endgroup::"
          done
          kubectl -n spark describe pods | tail -150 || true

  postgres:
    name: PostgreSQL principal · Zalando + pg_lake + sauvegardes sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image PostgreSQL + pg_lake
        uses: docker/build-push-action@v6
        with:
          context: image/postgres-lake
          load: true
          tags: postgres-lake:18
          cache-from: type=gha,scope=postgres-lake
          cache-to: type=gha,mode=max,scope=postgres-lake
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lakehouse
          config: scripts/dev/kind.yaml
      - name: Charger l'image dans kind
        run: kind load docker-image postgres-lake:18 --name lakehouse
      - name: Secrets de test
        run: scripts/generer-secrets.sh --si-absents
      - name: Stockage des sauvegardes, hors de Kubernetes (conteneur Docker sur le réseau de kind)
        run: scripts/dev/sauvegardes.sh
      - name: Opérateur PostgreSQL
        run: |
          kubectl apply --server-side -k tests/integration/operateurs
          kubectl wait --for=condition=established crd/postgresqls.acid.zalan.do crd/kafkas.kafka.strimzi.io crd/kafkanodepools.kafka.strimzi.io crd/kafkatopics.kafka.strimzi.io crd/scaledobjects.keda.sh --timeout=120s
          kubectl -n spark rollout status deploy/postgres-operator --timeout=240s
      - name: Déployer stockage + PostgreSQL
        run: kubectl apply -k tests/integration/postgres
      - name: Attendre MinIO, Polaris, PostgreSQL et le schéma
        run: |
          kubectl -n spark rollout status sts/minio --timeout=240s
          kubectl -n spark wait --for=condition=complete job/minio-init job/polaris-bootstrap job/polaris-init --timeout=300s
          kubectl -n spark wait --for=jsonpath='{.status.PostgresClusterStatus}'=Running postgresql/lake-principal --timeout=600s
          kubectl -n spark wait --for=condition=complete job/lake-schema --timeout=300s
          kubectl -n spark rollout status deploy/lake-analytique --timeout=300s
          kubectl -n spark get pods -o wide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test d'intégration
        run: |
          echo '127.0.0.1 minio' | sudo tee -a /etc/hosts
          pip install "pyiceberg[pyarrow]" "psycopg[binary]"
          python tests/integration/tester_postgres.py
      - name: Pool analytique (lecture seule, Power BI / Qlik)
        run: python tests/integration/tester_analytique.py
      - name: Sauvegardes et restauration à un instant donné
        run: python tests/integration/tester_restauration.py
      - name: Diagnostic en cas d'échec
        if: failure() || cancelled()
        run: |
          kubectl -n spark get pods,jobs,postgresql -o wide || true
          for r in deploy/postgres-operator job/lake-schema job/polaris-init deploy/polaris deploy/lake-analytique; do
            echo "::group::logs $r"; kubectl -n spark logs "$r" --all-containers --tail=80 --prefix || true; echo "::endgroup::"
          done
          for p in $(kubectl -n spark get pods -l 'cluster-name in (lake-principal,lake-restaure)' -o name); do
            echo "::group::logs $p"; kubectl -n spark logs "$p" --all-containers --tail=120 --prefix || true; echo "::endgroup::"
          done
          kubectl -n spark describe pods -l cluster-name=lake-principal | tail -80 || true

  ecriture:
    name: Écritures · passerelle → Kafka → writers KEDA → PostgreSQL sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image PostgreSQL + pg_lake
        uses: docker/build-push-action@v6
        with:
          context: image/postgres-lake
          load: true
          tags: postgres-lake:18
          cache-from: type=gha,scope=postgres-lake
      - name: Construire l'image des writers
        uses: docker/build-push-action@v6
        with:
          context: python
          file: python/ecrivain/Dockerfile
          load: true
          tags: lakehouse-ecrivain:1.0
          cache-from: type=gha,scope=lakehouse-ecrivain
      - name: Construire l'image de la passerelle
        uses: docker/build-push-action@v6
        with:
          context: python
          file: python/passerelle/Dockerfile
          load: true
          tags: lakehouse-passerelle:1.0
          cache-from: type=gha,scope=lakehouse-passerelle
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lakehouse
          config: scripts/dev/kind.yaml
      - name: Charger les images dans kind
        run: kind load docker-image postgres-lake:18 lakehouse-ecrivain:1.0 lakehouse-passerelle:1.0 --name lakehouse
      - name: Secrets de test
        run: scripts/generer-secrets.sh --si-absents
      - name: Stockage des sauvegardes, hors de Kubernetes
        run: scripts/dev/sauvegardes.sh
      - name: Opérateurs (PostgreSQL, Kafka, KEDA)
        run: |
          kubectl apply --server-side -k tests/integration/operateurs
          kubectl wait --for=condition=established crd/postgresqls.acid.zalan.do crd/kafkas.kafka.strimzi.io crd/kafkanodepools.kafka.strimzi.io crd/kafkatopics.kafka.strimzi.io crd/scaledobjects.keda.sh --timeout=120s
          kubectl -n spark rollout status deploy/postgres-operator deploy/strimzi-cluster-operator --timeout=300s
          kubectl -n keda rollout status deploy/keda-operator deploy/keda-metrics-apiserver deploy/keda-admission --timeout=300s
      - name: Déployer le chemin d'écriture
        run: kubectl apply -k tests/integration/ecriture
      - name: Attendre Polaris, Kafka, PostgreSQL, le schéma, les writers et la passerelle
        run: |
          # lake.creer_table crée des tables Iceberg via Polaris : le principal « postgres » doit y exister
          # (polaris-init) ; sans cette attente, le test pouvait commencer avant (HTTP 401, constaté en CI)
          kubectl -n spark wait --for=condition=complete job/minio-init job/polaris-bootstrap job/polaris-init --timeout=420s
          kubectl -n spark wait --for=condition=Ready kafka/lakehouse --timeout=600s
          kubectl -n spark wait --for=condition=Ready kafkatopic/app kafkatopic/app-rejets --timeout=300s
          kubectl -n spark wait --for=jsonpath='{.status.PostgresClusterStatus}'=Running postgresql/lake-principal --timeout=600s
          kubectl -n spark wait --for=condition=complete job/lake-schema --timeout=300s
          kubectl -n spark rollout status deploy/ecrivain deploy/passerelle --timeout=300s
          kubectl -n spark get pods -o wide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ni perte ni doublon (writer tué en plein flux), autoscaling KEDA
        run: |
          pip install httpx "pyiceberg[pyarrow]"
          python tests/integration/tester_ecritures.py
      - name: Test de charge k6 réduit (200 écritures/s, p99 < 500 ms)
        run: |
          kubectl -n spark exec "$(kubectl -n spark get pods -l cluster-name=lake-principal,spilo-role=master -o name)" -c postgres -- \
            psql -U postgres -d lake -c "SELECT lake.creer_table('charge', 'client text, montant numeric(12,2)')"
          kubectl -n spark port-forward svc/passerelle 18000:8000 >/dev/null 2>&1 &
          sleep 3
          docker run --rm --network host -i grafana/k6:1.0.0 run -e URL=http://localhost:18000 -e RATE=200 -e DUREE=30s - < tests/charge/ecritures.js
      - name: Diagnostic en cas d'échec
        if: failure() || cancelled()
        run: |
          kubectl -n spark get pods,jobs,kafka,kafkatopic,postgresql,scaledobject,hpa -o wide || true
          for r in deploy/ecrivain deploy/passerelle deploy/strimzi-cluster-operator job/lake-schema job/polaris-init deploy/polaris pod/rafale; do
            echo "::group::logs $r"; kubectl -n spark logs "$r" --all-containers --tail=80 --prefix || true; echo "::endgroup::"
          done
          echo "::group::KEDA"; kubectl -n keda logs deploy/keda-operator --tail=60 || true; kubectl -n spark describe scaledobject ecrivain | tail -30 || true; echo "::endgroup::"
          for p in $(kubectl -n spark get pods -l strimzi.io/cluster=lakehouse -o name); do
            echo "::group::logs $p"; kubectl -n spark logs "$p" --all-containers --tail=60 --prefix || true; echo "::endgroup::"
          done

  orchestration:
    name: Orchestration · Dagster → traitement Spark (bronze → silver → gold) sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Place disque (images Spark et PostgreSQL, en double dans Docker et dans kind)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image Spark (pilotes et executors des traitements)
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: spark-lakehouse:4.1.3
          cache-from: type=gha,scope=spark-lakehouse
      - name: Construire l'image PostgreSQL (base de Dagster)
        uses: docker/build-push-action@v6
        with:
          context: image/postgres-lake
          load: true
          tags: postgres-lake:18
          cache-from: type=gha,scope=postgres-lake
      - name: Construire l'image Dagster
        uses: docker/build-push-action@v6
        with:
          context: python
          file: python/orchestration/Dockerfile
          load: true
          tags: lakehouse-dagster:1.0
          cache-from: type=gha,scope=lakehouse-dagster
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lakehouse
          config: scripts/dev/kind.yaml
      - name: Charger les images dans kind
        run: kind load docker-image spark-lakehouse:4.1.3 postgres-lake:18 lakehouse-dagster:1.0 --name lakehouse
      - name: Secrets de test
        run: scripts/generer-secrets.sh --si-absents
      - name: Opérateurs
        run: |
          kubectl apply --server-side -k tests/integration/operateurs
          kubectl wait --for=condition=established crd/postgresqls.acid.zalan.do crd/kafkas.kafka.strimzi.io crd/kafkanodepools.kafka.strimzi.io crd/kafkatopics.kafka.strimzi.io crd/scaledobjects.keda.sh --timeout=120s
          kubectl -n spark rollout status deploy/postgres-operator --timeout=240s
      - name: Déployer stockage + Dagster
        run: kubectl apply -k tests/integration/orchestration
      - name: Attendre MinIO, Polaris, la base de Dagster et Dagster
        run: |
          kubectl -n spark rollout status sts/minio --timeout=240s
          kubectl -n spark wait --for=condition=complete job/minio-init job/polaris-bootstrap job/polaris-init --timeout=300s
          kubectl -n spark wait --for=jsonpath='{.status.PostgresClusterStatus}'=Running postgresql/lake-outils --timeout=600s
          kubectl -n spark rollout status deploy/dagster-code deploy/dagster-webserver deploy/dagster-daemon --timeout=300s
          kubectl -n spark get pods -o wide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test d'intégration
        run: |
          echo '127.0.0.1 minio' | sudo tee -a /etc/hosts
          pip install httpx "pyiceberg[pyarrow]"
          python tests/integration/tester_orchestration.py
      - name: Diagnostic en cas d'échec
        if: failure() || cancelled()
        run: |
          kubectl -n spark get pods,jobs,postgresql -o wide || true
          for r in deploy/dagster-code deploy/dagster-daemon deploy/dagster-webserver job/polaris-init deploy/polaris; do
            echo "::group::logs $r"; kubectl -n spark logs "$r" --all-containers --tail=120 --prefix || true; echo "::endgroup::"
          done
          for p in $(kubectl -n spark get pods -l 'app=traitement' -o name) $(kubectl -n spark get pods -l spark-role=executor -o name); do
            echo "::group::logs $p"; kubectl -n spark logs "$p" --all-containers --tail=200 --prefix || true; echo "::endgroup::"
          done
          kubectl -n spark get events --sort-by=.lastTimestamp | tail -60 || true
          kubectl -n spark describe pods -l app=traitement | tail -80 || true

  evenements:
    name: Événements · Kafka → capteur Dagster → Spark → bronze.events sur kind
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Place disque (images Spark et PostgreSQL, en double dans Docker et dans kind)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: docker/setup-buildx-action@v3
      - name: Construire l'image Spark (pilotes et executors des traitements)
        uses: docker/build-push-action@v6
        with:
          context: image
          load: true
          tags: spark-lakehouse:4.1.3
          cache-from: type=gha,scope=spark-lakehouse
      - name: Construire l'image PostgreSQL (base de Dagster)
        uses: docker/build-push-action@v6
        with:
          context: image/postgres-lake
          load: true
          tags: postgres-lake:18
          cache-from: type=gha,scope=postgres-lake
      - name: Construire l'image Dagster
        uses: docker/build-push-action@v6
        with:
          context: python
          file: python/orchestration/Dockerfile
          load: true
          tags: lakehouse-dagster:1.0
          cache-from: type=gha,scope=lakehouse-dagster
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: lakehouse
          config: scripts/dev/kind.yaml
      - name: Charger les images dans kind
        run: kind load docker-image spark-lakehouse:4.1.3 postgres-lake:18 lakehouse-dagster:1.0 --name lakehouse
      - name: Secrets de test
        run: scripts/generer-secrets.sh --si-absents
      - name: Opérateurs
        run: |
          kubectl apply --server-side -k tests/integration/operateurs
          kubectl wait --for=condition=established crd/postgresqls.acid.zalan.do crd/kafkas.kafka.strimzi.io crd/kafkanodepools.kafka.strimzi.io crd/kafkatopics.kafka.strimzi.io crd/scaledobjects.keda.sh --timeout=120s
          kubectl -n spark rollout status deploy/postgres-operator deploy/strimzi-cluster-operator --timeout=300s
      - name: Déployer stockage + Kafka + Dagster
        run: kubectl apply -k tests/integration/evenements
      - name: Attendre MinIO, Polaris, Kafka, la base de Dagster et Dagster
        run: |
          kubectl -n spark rollout status sts/minio --timeout=240s
          kubectl -n spark wait --for=condition=complete job/minio-init job/polaris-bootstrap job/polaris-init --timeout=420s
          kubectl -n spark wait --for=condition=Ready kafka/lakehouse --timeout=600s
          kubectl -n spark wait --for=condition=Ready kafkatopic/events --timeout=300s
          kubectl -n spark wait --for=jsonpath='{.status.PostgresClusterStatus}'=Running postgresql/lake-outils --timeout=600s
          kubectl -n spark rollout status deploy/dagster-code deploy/dagster-webserver deploy/dagster-daemon --timeout=300s
          kubectl -n spark get pods -o wide
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test d'intégration
        run: |
          echo '127.0.0.1 minio' | sudo tee -a /etc/hosts
          pip install httpx "pyiceberg[pyarrow]"
          python tests/integration/tester_evenements.py
      - name: Diagnostic en cas d'échec
        if: failure() || cancelled()
        run: |
          kubectl -n spark get pods,jobs,kafka,kafkatopic,postgresql -o wide || true
          for r in deploy/dagster-code deploy/dagster-daemon deploy/dagster-webserver job/polaris-init deploy/polaris; do
            echo "::group::logs $r"; kubectl -n spark logs "$r" --all-containers --tail=150 --prefix || true; echo "::endgroup::"
          done
          for p in $(kubectl -n spark get pods -l 'app=traitement' -o name) $(kubectl -n spark get pods -l spark-role=executor -o name); do
            echo "::group::logs $p"; kubectl -n spark logs "$p" --all-containers --tail=200 --prefix || true; echo "::endgroup::"
          done
          kubectl -n spark exec lakehouse-noeuds-0 -- bin/kafka-consumer-groups.sh --bootstrap-server localhost:9092 --describe --group lakehouse-events || true
          kubectl -n spark get events --sort-by=.lastTimestamp | tail -60 || true
